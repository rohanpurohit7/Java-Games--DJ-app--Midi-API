name: Amp Studio Guitar Demo Gate

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  demo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile demo application
        run: gradle --no-daemon clean classes
      - name: Verify active application and helpers
        shell: bash
        run: |
          set -euo pipefail
          SRC=src/main/java/io/github/rohanpurohit7/mididj
          test -f "$SRC/AmpStudioGuitarApp.java"
          test "$(grep -RIl 'extends Application' "$SRC" | wc -l)" -eq 1
          grep -q "AmpStudioGuitarApp" build.gradle
          for file in StudioAudioEngine StudioBackingCatalog GuitarArticulationEngine GuitarTheory GuitarStyleAdvisor GuitarPhotoCard FreePatsGuitarLibrary ContinuousImprovPlanner; do
            test -f "$SRC/$file.java"
          done
      - name: Verify demo controls
        shell: bash
        run: |
          set -euo pipefail
          APP=src/main/java/io/github/rohanpurohit7/mididj/AmpStudioGuitarApp.java
          grep -q 'PLAY BACKING BAND' "$APP"
          grep -q 'PLAY LICK OVER BAND' "$APP"
          grep -q 'SEE TRACE' "$APP"
          grep -q 'PLAY CONTINUOUS IMPROV' "$APP"
          grep -q 'INSTALL FREEPATS GUITAR' "$APP"
          grep -q 'playBackingSequence' src/main/java/io/github/rohanpurohit7/mididj/StudioAudioEngine.java
          grep -q 'playLeadSequence' src/main/java/io/github/rohanpurohit7/mididj/StudioAudioEngine.java
