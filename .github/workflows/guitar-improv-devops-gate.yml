name: Amp Studio Guitar Web Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and prepare open assets
        run: npm install
      - name: Build React application
        run: npm run build
      - name: Verify core guitar experience
        shell: bash
        run: |
          set -euo pipefail
          test -f src/App.jsx
          test -f src/audio/guitarEngine.js
          test -f src/music/lickGenerator.js
          grep -q 'PLAY LICK OVER BAND' src/App.jsx
          grep -q 'PLAY CONTINUOUS IMPROV' src/App.jsx
          grep -q 'hammer-on' src/music/lickGenerator.js
          grep -q 'pitchWheel' src/audio/guitarEngine.js
          grep -q 'freepats-clean-electric-guitar.sf2' src/audio/guitarEngine.js
          test -f public/soundfonts/freepats-clean-electric-guitar.sf2
          test -f public/assets/studio-electric-guitar.jpg
          test -f dist/index.html
      - name: Upload web demo
        uses: actions/upload-artifact@v4
        with:
          name: amp-studio-guitar-web
          path: dist/
          if-no-files-found: error
